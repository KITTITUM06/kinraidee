<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KinRaiDee - เข้าสู่ระบบ Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Kanit', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-[420px] bg-white rounded-3xl p-8 sm:p-10 shadow-[0_10px_40px_rgba(0,0,0,0.06)] border border-slate-100 flex flex-col items-center text-center">
    
    <!-- กล่องไอคอนกุญแจสีส้มอ่อน -->
    <div class="w-16 h-16 rounded-2xl bg-amber-50 flex items-center justify-center text-3xl mb-5 shadow-sm border border-amber-100/60">
      🔐
    </div>

    <h1 class="text-2xl font-black text-slate-900 tracking-tight mb-1">
      เข้าสู่ระบบ Admin
    </h1>
    <p class="text-xs text-slate-400 font-medium mb-6">
      ยืนยันสิทธิ์เพื่อจัดการคลังอาหารและดูแลระบบ
    </p>

    <form id="adminLoginForm" class="w-full text-left space-y-4">
      <!-- Username -->
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1.5">ชื่อผู้ใช้งาน (Username)</label>
        <input 
          type="text" 
          id="usernameInput" 
          required 
          value="admin" 
          class="w-full px-4 py-3 rounded-xl bg-white border border-slate-200 text-sm text-slate-800 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition"
        >
      </div>

      <!-- Password + ลูกตาเปิด/ปิด -->
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1.5">รหัสผ่าน (Password)</label>
        <div class="relative">
          <input 
            type="password" 
            id="passwordInput" 
            required 
            placeholder="••••••••" 
            class="w-full px-4 py-3 pr-11 rounded-xl bg-white border border-amber-400 text-sm text-slate-800 focus:outline-none focus:border-amber-500 transition"
          >
          <button 
            type="button" 
            onclick="togglePasswordVisibility()" 
            class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition text-base"
          >
            👁️
          </button>
        </div>
      </div>

      <!-- ข้อความแจ้งเตือนเมื่อรหัสผิด -->
      <div id="loginErrorMsg" class="hidden text-xs text-red-500 font-bold text-center py-1.5 bg-red-50 rounded-lg"></div>

      <!-- ปุ่มเข้าสู่ระบบ -->
      <button 
        type="submit" 
        id="loginSubmitBtn"
        class="w-full py-3.5 mt-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-bold text-sm shadow-md shadow-amber-500/20 transition transform active:scale-95"
      >
        เข้าสู่ระบบจัดการ →
      </button>

      <!-- ข้อความช่วยจำด้านล่าง -->
      <div class="text-center pt-3 text-[11px] text-slate-400">
        เข้าใช้งานครั้งแรก: <span class="text-amber-500 font-semibold underline">admin</span> / <span class="text-amber-500 font-semibold underline">admin1234</span>
      </div>
    </form>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/ui_feedback.js"></script>
  <script src="admin_login.js"></script>
</body>
</html>
